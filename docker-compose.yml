version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quizonline_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: quizonline
      DB_USER: quizonline_user
      DB_PASS: quizonline_pass
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: quizonline_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: quizonline
      MYSQL_USER: quizonline_user
      MYSQL_PASSWORD: quizonline_pass
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - quizonline_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 4s
      timeout: 4s
      retries: 15
      start_period: 10s

volumes:
  quizonline_db_data:
