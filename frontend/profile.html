<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>My Profile</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <script src="assets/app.js"></script>
    <script src="assets/layout.js"></script>
    <main class="container">
      <div class="page-heading">
        <div>
          <span class="eyebrow">MY ACCOUNT</span>
          <h1>Profile & academic details</h1>
        </div>
      </div>
      <div class="profile-layout">
        <aside class="card profile-card">
          <img id="profile-photo" class="profile-photo" alt="Profile photo" />
          <h2 id="profile-name">My profile</h2>
          <input
            id="photo"
            type="file"
            accept="image/png,image/jpeg,image/webp"
          /><button type="button" onclick="uploadPhoto()">Upload photo</button>
          <div id="profile-details" class="detail-list"></div>
        </aside>
        <form
          class="card"
          onsubmit="
            event.preventDefault();
            saveProfile();
          "
        >
          <h2>Contact information</h2>
          <div id="message"></div>
          <div class="form-grid">
            <label>Full name<input id="name" required /></label
            ><label>Email<input id="email" type="email" required /></label
            ><label>Phone<input id="phone" /></label
            ><label
              >Gender<select id="gender">
                <option value="">Select</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
              </select></label
            >
          </div>
          <button>Save changes</button>
        </form>
      </div>
      <h2>Semester-wise result history</h2>
      <table id="history"></table>
    </main>
    <script>
      profile().catch(error);
    </script>
  </body>
</html>
