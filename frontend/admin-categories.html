<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Manage Categories</title>
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="stylesheet" href="assets/management.css" />
  </head>
  <body>
    <script src="assets/app.js"></script>
    <script src="assets/layout.js"></script>
    <main class="container">
      <div class="page-heading">
        <div>
          <span class="eyebrow">ADMINISTRATION</span>
          <h1>Quiz categories</h1>
          <p class="muted">Organize quizzes into clear academic subjects.</p>
        </div>
        <a class="button secondary" href="admin.html">Back to dashboard</a>
      </div>
      <div id="message"></div>
      <form
        class="card category-form"
        onsubmit="
          event.preventDefault();
          saveCategory();
        "
      >
        <input id="category-id" type="hidden" /><label
          >Category name<input
            id="category-name"
            placeholder="Example: Computer Science"
            required /></label
        ><button id="category-submit">Add category</button>
        <button class="secondary" type="button" onclick="resetCategoryForm()">
          Clear
        </button>
      </form>
      <div id="category-list" class="category-grid"></div>
    </main>
    <script>
      loadCategories().catch(error);
    </script>
  </body>
</html>
